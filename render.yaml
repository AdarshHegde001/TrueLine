projects:
  - name: TrueLine
    environments:
      - name: production
        services:
          - type: web
            name: trueline-api
            runtime: docker
            plan: 1c-2g
            region: oregon
            dockerfilePath: ./backend/Dockerfile
            dockerContext: .
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            disk:
              name: trueline-assets
              mountPath: /var/data
              sizeGB: 1
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: TRUELINE_ASSET_DIR
                value: /var/data/assets
              - key: PYTHON_BIN
                value: /opt/venv/bin/python
              - key: TRUELINE_BRAND_ID
                value: brand_lumina
              - key: TRUELINE_ORGANIZATION_NAME
                value: Lumina Studio
              - key: GEMINI_EMBEDDING_API_KEY
                sync: false
              - key: TRUELINE_EXTRACTION_API_KEY
                sync: false
              - key: TRUELINE_TONE_API_KEY
                sync: false
              - key: TRUELINE_CLAIMS_API_KEY
                sync: false
              - key: TRUELINE_SUMMARY_API_KEY
                sync: false
              - key: TRUELINE_CORRECTION_API_KEY
                sync: false
              - key: TRUELINE_LOGO_API_KEY
                sync: false

